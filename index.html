<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash - Cross Platform</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');
        
        body { 
            margin: 0; background: #000; color: white; overflow: hidden; 
            font-family: 'Orbitron', sans-serif; 
            touch-action: none; /* Prevents phone from scrolling/zooming */
            user-select: none;  /* Prevents text highlighting on rapid taps */
            -webkit-tap-highlight-color: transparent; /* Removes blue tap box on mobile */
        }
        
        canvas { display: block; width: 100vw; height: 100vh; }

        #hud {
            position: absolute; top: 20px; width: 100%; display: flex; 
            justify-content: space-between; padding: 0 5%; box-sizing: border-box;
            pointer-events: none; z-index: 5; font-size: 18px;
        }

        .overlay {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: rgba(0,0,0,0.9);
            z-index: 10;
        }

        .btn {
            padding: 18px; margin: 8px; width: 85%; max-width: 300px;
            background: #111; color: #00f2ff; border: 3px solid #00f2ff;
            font-family: 'Orbitron'; font-size: 16px; cursor: pointer;
            border-radius: 10px; transition: 0.2s; text-transform: uppercase;
        }

        .btn.locked {
            border-color: #333; color: #333; cursor: not-allowed; opacity: 0.5;
        }

        .btn:not(.locked):active { transform: scale(0.95); background: #00f2ff; color: #000; }

        #progress-container { position: absolute; top: 0; width: 100%; height: 6px; background: #222; }
        #progress-bar { width: 0%; height: 100%; background: #fff; box-shadow: 0 0 15px #fff; transition: width 0.1s; }
    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <div id="hud">
        <div>LVL: <span id="lvlNum">1</span></div>
        <div id="percent">0%</div>
    </div>

    <div id="menu" class="overlay">
        <h1 style="text-shadow: 0 0 15px #00f2ff; font-size: 24px; text-align: center;">GEOMETRY DASH</h1>
        <button id="btn-1" class="btn" onclick="startGame(1)">01 - EASY</button>
        <button id="btn-2" class="btn locked" onclick="startGame(2)">02 - ORANGE DRIVE</button>
        <button id="btn-3" class="btn locked" onclick="startGame(3)">03 - RED VOID</button>
        <p style="font-size: 10px; color: #555; margin-top: 15px;">PC: SPACE/CLICK | PHONE: TAP</p>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const pBar = document.getElementById('progress-bar');
        
        let gameState = "MENU";
        let currentLvl = 1;
        let scrollX = 0;
        let isPressing = false;
        
        const groundHeight = 100;
        const speeds = { 1: 8, 2: 13, 3: 18 };
        const bgColors = { 1: "#000000", 2: "#4a2300", 3: "#4a0000" };

        let player = { 
            x: 100, y: 0, size: 35, 
            dy: 0, gravity: 0.9, jumpPower: -15,
            rotation: 0, onGround: false
        };

        let obstacles = [];

        function updateMenuLocks() {
            const unlocked = parseInt(localStorage.getItem('gd_max_lvl')) || 1;
            for (let i = 2; i <= 3; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (unlocked >= i) btn.classList.remove('locked');
                else btn.classList.add('locked');
            }
        }

        function startGame(lvl) {
            const unlocked = parseInt(localStorage.getItem('gd_max_lvl')) || 1;
            if (lvl > unlocked) return;
            currentLvl = lvl;
            document.getElementById('lvlNum').innerText = lvl;
            document.getElementById('menu').style.display = "none";
            gameState = "PLAY";
            resetLevel();
        }

        function resetLevel() {
            player.y = canvas.height - groundHeight - player.size;
            player.dy = 0;
            player.rotation = 0;
            scrollX = 0;
            obstacles = [];
            for(let i=0; i<80; i++) {
                let x = 1000 + (i * 450);
                let type = Math.random() > 0.5 ? 'spike' : 'block';
                obstacles.push({ type, x, y: canvas.height - groundHeight - 40, w: 40, h: 40 });
            }
        }

        // --- CROSS-PLATFORM INPUTS ---
        const handleJump = (active) => isPressing = active;

        // PC Inputs
        window.addEventListener('keydown', (e) => { if(e.code === "Space" || e.code === "ArrowUp") handleJump(true); });
        window.addEventListener('keyup', (e) => { if(e.code === "Space" || e.code === "ArrowUp") handleJump(false); });
        window.addEventListener('mousedown', () => handleJump(true));
        window.addEventListener('mouseup', () => handleJump(false));

        // Phone Inputs
        window.addEventListener('touchstart', (e) => { 
            handleJump(true); 
            if(gameState === "PLAY") e.preventDefault(); 
        }, {passive: false});
        window.addEventListener('touchend', () => handleJump(false));

        function update() {
            if (gameState !== "PLAY") return;

            scrollX += speeds[currentLvl];
            
            if (isPressing && player.onGround) {
                player.dy = player.jumpPower;
                player.onGround = false;
            }

            player.dy += player.gravity;
            player.y += player.dy;

            const floor = canvas.height - groundHeight - player.size;
            if (player.y >= floor) {
                player.y = floor;
                player.dy = 0;
                player.onGround = true;
                player.rotation = Math.round(player.rotation / 90) * 90;
            } else {
                player.onGround = false;
                player.rotation += speeds[currentLvl] * 0.8;
            }

            obstacles.forEach(o => {
                let rx = o.x - scrollX;
                if (player.x < rx + o.w - 5 && player.x + player.size > rx + 5 &&
                    player.y < o.y + o.h - 5 && player.y + player.size > o.y + 5) {
                    gameState = "MENU";
                    document.getElementById('menu').style.display = "flex";
                }
            });

            let progress = Math.min(100, Math.floor((scrollX / 35000) * 100));
            document.getElementById('percent').innerText = progress + "%";
            pBar.style.width = progress + "%";

            if (progress >= 100) {
                const nextLvl = currentLvl + 1;
                const currentMax = parseInt(localStorage.getItem('gd_max_lvl')) || 1;
                if (nextLvl > currentMax && nextLvl <= 3) localStorage.setItem('gd_max_lvl', nextLvl);
                updateMenuLocks();
                gameState = "MENU";
                document.getElementById('menu').style.display = "flex";
            }
        }

        function draw() {
            ctx.fillStyle = bgColors[currentLvl];
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === "PLAY") {
                ctx.fillStyle = "rgba(0,0,0,0.5)";
                ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
                ctx.fillStyle = "white";
                ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 2);

                obstacles.forEach(o => {
                    let rx = o.x - scrollX;
                    if(rx < -50 || rx > canvas.width + 50) return;
                    ctx.fillStyle = "white";
                    if(o.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(rx, o.y + o.h);
                        ctx.lineTo(rx + o.w/2, o.y);
                        ctx.lineTo(rx + o.w, o.y + o.h);
                        ctx.fill();
                    } else {
                        ctx.fillRect(rx, o.y, o.w, o.h);
                    }
                });

                ctx.save();
                ctx.translate(player.x + player.size/2, player.y + player.size/2);
                ctx.rotate(player.rotation * Math.PI / 180);
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f2ff";
                ctx.fillStyle = "#00f2ff";
                ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
                ctx.strokeStyle = "white";
                ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
                ctx.restore();
            }
            requestAnimationFrame(draw);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (gameState === "PLAY") player.y = canvas.height - groundHeight - player.size;
        }

        window.addEventListener('resize', resize);
        resize();
        updateMenuLocks();
        setInterval(update, 1000/60);
        draw();
    </script>
</body>
</html>
